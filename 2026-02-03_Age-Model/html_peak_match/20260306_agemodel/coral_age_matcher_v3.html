<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coral Age Matcher</title>
<style>
  :root {
    --bg:#0a0e14; --panel:#111720; --border:#1e2a38;
    --coral:#e05c5c; --clim:#4ecdc4; --match:#8b5cf6;
    --sel-coral:#ff9f43; --sel-clim:#74b9ff;
    --bound:#f0b429; --xray:#d2a8ff;
    --text:#cdd6e0; --muted:#4a6075; --accent:#56d364;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--bg); color:var(--text);
    font-family:'JetBrains Mono',monospace; overflow:hidden; display:flex; flex-direction:column; }
  
  #toolbar {
    background:var(--panel); border-bottom:1px solid var(--border);
    padding:6px 12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex-shrink:0; font-size:11px;
  }
  .sep { width:1px; height:22px; background:var(--border); margin:0 2px; flex-shrink:0; }
  .btn {
    background:transparent; border:1px solid var(--border); color:var(--muted);
    padding:4px 10px; border-radius:3px; cursor:pointer; font:11px/1 'JetBrains Mono',monospace;
    transition:all .12s; white-space:nowrap;
  }
  .btn:hover { border-color:var(--text); color:var(--text); }
  .btn.active  { background:var(--coral); border-color:var(--coral); color:#fff; }
  .btn.active-edit { background:#1a2e10; border-color:var(--accent); color:var(--accent); }
  .btn.io  { border-color:#1e3a28; color:var(--accent); }
  .btn.io:hover { background:#1a2e1e; }

  .chk-wrap { display:flex; align-items:center; gap:4px; color:var(--muted); cursor:pointer; white-space:nowrap; }
  .chk-wrap input { accent-color:var(--accent); cursor:pointer; }
  .chk-wrap:hover { color:var(--text); }

  #corr-badge {
    margin-left:auto; background:var(--panel); border:1px solid var(--border);
    border-radius:3px; padding:3px 9px; font-size:10px; color:var(--muted); white-space:nowrap;
  }
  #corr-badge span { color:var(--accent); font-weight:600; }

  #charts { flex:1; display:flex; flex-direction:column; min-height:0; }
  .chart-wrap {
    flex:1; min-height:0; position:relative;
    border-bottom:1px solid var(--border); overflow:hidden;
  }
  .chart-wrap canvas { display:block; width:100%; height:100%; }
  .chart-label {
    position:absolute; top:4px; left:66px;
    font-size:9px; color:var(--muted); pointer-events:none; letter-spacing:.04em;
  }

  #statusbar {
    background:var(--panel); border-top:1px solid var(--border);
    padding:4px 12px; font-size:10px; color:var(--muted); flex-shrink:0;
  }
  #status { color:var(--text); }

  #tooltip {
    position:fixed; background:#0c1520; border:1px solid var(--border);
    border-radius:4px; padding:6px 9px; font-size:10px; line-height:1.7;
    pointer-events:none; display:none; z-index:999; max-width:210px;
  }
</style>
</head>
<body>

<div id="toolbar">
  <button class="btn active" id="btn-match" onclick="setMode('match')">⊕ Match</button>
  <button class="btn" id="btn-edit"  onclick="setMode('edit')">⟷ Edit Bands</button>
  <div class="sep"></div>
  <label class="chk-wrap"><input type="checkbox" id="chk-overlay" checked onchange="draw()"> Overlay</label>
  <label class="chk-wrap"><input type="checkbox" id="chk-ma"      checked onchange="draw()"> 3-pt MA</label>
  <label class="chk-wrap"><input type="checkbox" id="chk-xray"    checked onchange="draw()"> X-ray</label>
  <div class="sep"></div>
  <button class="btn" onclick="undoLast()">↩ Undo</button>
  <button class="btn" onclick="clearAll()">✕ Clear</button>
  <div class="sep"></div>
  <button class="btn io" onclick="exportCSV()">↓ Export</button>
  <label class="btn io" style="cursor:pointer">↑ Import<input type="file" id="imp" accept=".csv" style="display:none" onchange="importCSV(event)"></label>
  <div id="corr-badge">r = <span id="corr-val">—</span> &nbsp;|&nbsp; <span id="matched-count">0</span> matched / <span id="coral-count">?</span> bands</div>
</div>

<div id="charts">
  <div class="chart-wrap" id="wrap-coral">
    <canvas id="cc"></canvas>
    <div class="chart-label" id="lbl-coral">coral δ¹⁸O — drag to pan · scroll to zoom · match mode: click band then climate cycle</div>
  </div>
  <div class="chart-wrap" id="wrap-clim">
    <canvas id="ck"></canvas>
    <div class="chart-label">climate δ¹⁸O (1958–2019) — drag to pan · scroll to zoom</div>
  </div>
</div>

<div id="statusbar"><span id="status">Match mode: click a coral band → click the matching climate cycle</span></div>
<div id="tooltip"></div>

// Per-chart pan/zoom view (calendar year space for both)
const extCoralRaw = (() => {
  let xn=Infinity,xx=-Infinity,yn=Infinity,yx=-Infinity;
  for(const p of CORAL_SERIES){if(p.x<xn)xn=p.x;if(p.x>xx)xx=p.x;if(p.y<yn)yn=p.y;if(p.y>yx)yx=p.y;}
  return{xMin:xn,xMax:xx,yMin:yn,yMax:yx};
})();
const extClimRaw = (() => {
  let xn=Infinity,xx=-Infinity,yn=Infinity,yx=-Infinity;
  for(const p of CLIM_SERIES){if(p.x<xn)xn=p.x;if(p.x>xx)xx=p.x;if(p.y<yn)yn=p.y;if(p.y>yx)yx=p.y;}
  return{xMin:xn,xMax:xx,yMin:yn,yMax:yx};
})();

// Views track x-range visible; coral in warped calendar year space, clim in calendar year
let coralView = { xMin:extCoralRaw.xMin-1, xMax:extCoralRaw.xMax+1 };
let climView  = { xMin:extClimRaw.xMin-1,  xMax:extClimRaw.xMax+1  };

// ── CORAL CYCLES ──────────────────────────────────────────────────────────────
function findPeak(t0, t1) {
  let best=null;
  for(const p of CORAL_SERIES) if(p.x>=t0&&p.x<=t1&&(!best||p.y>best.y)) best=p;
  return best||{x:(t0+t1)/2,y:0};
}
function buildCoralCycles() {
  return coralBounds.slice(0,-1).map((b,i)=>{
    const t0=b,t1=coralBounds[i+1],pk=findPeak(t0,t1);
    return{id:i+1,start:t0,end:t1,peak_age:pk.x,peak_val:pk.y};
  });
}

// ── WARP: raw coral x → calendar year ────────────────────────────────────────
function buildWarpAnchors() {
  if(!matches.length) return null;
  const cycs=buildCoralCycles();
  const anchors=[];
  for(const m of matches){
    const cc=cycs.find(c=>c.id===m.coralId);
    const kc=CLIM_CYCLES.find(c=>c.id===m.climId);
    if(!cc||!kc) continue;
    anchors.push({cx:cc.start,ky:kc.start});
    anchors.push({cx:cc.end,  ky:kc.end  });
  }
  anchors.sort((a,b)=>a.cx-b.cx);
  const dedup=[];
  for(const a of anchors) if(!dedup.length||Math.abs(a.cx-dedup[dedup.length-1].cx)>0.0001) dedup.push(a);
  return dedup.length>=2?dedup:null;
}

function warpX(rawX, anchors) {
  if(!anchors) return rawX; // no warp yet — keep raw
  if(rawX<=anchors[0].cx){
    const a=anchors[0],b=anchors[1];
    return a.ky+(b.ky-a.ky)/(b.cx-a.cx)*(rawX-a.cx);
  }
  if(rawX>=anchors[anchors.length-1].cx){
    const a=anchors[anchors.length-2],b=anchors[anchors.length-1];
    return b.ky+(b.ky-a.ky)/(b.cx-a.cx)*(rawX-b.cx);
  }
  for(let i=0;i<anchors.length-1;i++){
    const a=anchors[i],b=anchors[i+1];
    if(rawX>=a.cx&&rawX<=b.cx) return a.ky+(b.ky-a.ky)/(b.cx-a.cx)*(rawX-a.cx);
  }
  return rawX;
}

function unwarpX(calY, anchors) {
  // Invert warp: calendar year → raw coral x (binary search)
  if(!anchors) return calY;
  const lo=anchors[0].cx, hi=anchors[anchors.length-1].cx;
  let a=extCoralRaw.xMin,b=extCoralRaw.xMax;
  for(let i=0;i<50;i++){const mid=(a+b)/2; warpX(mid,anchors)<calY?a=mid:b=mid;}
  return(a+b)/2;
}

// ── CORAL Y-RANGE ─────────────────────────────────────────────────────────────
const CORAL_Y = (() => {
  let yn=Infinity,yx=-Infinity;
  for(const p of CORAL_SERIES){if(p.y<yn)yn=p.y;if(p.y>yx)yx=p.y;}
  const pad=(yx-yn)*0.1; return{min:yn-pad,max:yx+pad};
})();
const CLIM_Y = (() => {
  let yn=Infinity,yx=-Infinity;
  for(const p of CLIM_SERIES){if(p.y<yn)yn=p.y;if(p.y>yx)yx=p.y;}
  const pad=(yx-yn)*0.1; return{min:yn-pad,max:yx+pad};
})();

// Normalize climate y to coral y scale for overlay
function climToCoral(cy) {
  const t=(cy-CLIM_Y.min)/(CLIM_Y.max-CLIM_Y.min);
  return CORAL_Y.min+t*(CORAL_Y.max-CORAL_Y.min);
}

const PAD = {l:64,r:18,t:18,b:26};

function resize() {
  const DPR = devicePixelRatio;
  [['cc','wrap-coral'],['ck','wrap-clim']].forEach(([id,wid])=>{
    const el=document.getElementById(wid);
    const c=document.getElementById(id);
    c.width=el.clientWidth*DPR; c.height=el.clientHeight*DPR;
  });

}

// ── DRAW HELPERS ──────────────────────────────────────────────────────────────
function sxV(yr,view,W)  { return PAD.l+(yr-view.xMin)/(view.xMax-view.xMin)*(W-PAD.l-PAD.r); }
function syY(v,yext,H)   { return PAD.t+(1-(v-yext.min)/(yext.max-yext.min))*(H-PAD.t-PAD.b); }
function invSxV(px,view,W){ return view.xMin+(px-PAD.l)/(W-PAD.l-PAD.r)*(view.xMax-view.xMin); }

function drawGrid(ctx,view,yext,W,H,DPR) {
  ctx.save(); ctx.scale(DPR,DPR);
  const pw=W/DPR-PAD.l-PAD.r, ph=H/DPR-PAD.t-PAD.b;
  // X grid
  const span=view.xMax-view.xMin;
  const step=span>60?10:span>20?5:span>10?2:span>4?1:0.5;
  ctx.strokeStyle='rgba(30,42,56,0.7)'; ctx.lineWidth=1;
  for(let yr=Math.ceil(view.xMin/step)*step;yr<=view.xMax;yr+=Math.round(step*10)/10){
    const x=sxV(yr,view,W/DPR);
    if(x<PAD.l||x>PAD.l+pw) continue;
    ctx.beginPath();ctx.moveTo(x,PAD.t);ctx.lineTo(x,PAD.t+ph);ctx.stroke();
    ctx.fillStyle='#2e4055';ctx.font='9px JetBrains Mono,monospace';ctx.textAlign='center';
    ctx.fillText(step<1?yr.toFixed(1):yr,x,PAD.t+ph+14);
  }
  // Y grid
  for(let i=0;i<=4;i++){
    const v=yext.min+(yext.max-yext.min)*i/4;
    const y=syY(v,yext,H/DPR);
    ctx.strokeStyle='rgba(30,42,56,0.5)';ctx.beginPath();ctx.moveTo(PAD.l,y);ctx.lineTo(PAD.l+pw,y);ctx.stroke();
    ctx.fillStyle='#2e4055';ctx.font='9px JetBrains Mono,monospace';ctx.textAlign='right';
    ctx.fillText(v.toFixed(2),PAD.l-4,y+3);
  }
  // Clip box
  ctx.strokeStyle='#1e2a38';ctx.lineWidth=1;ctx.strokeRect(PAD.l,PAD.t,pw,ph);
  ctx.restore();
}

function clipRect(ctx,W,H,DPR) {
  ctx.beginPath();
  ctx.rect(PAD.l*DPR, PAD.t*DPR, (W-PAD.l-PAD.r)*DPR, (H-PAD.t-PAD.b)*DPR);
  ctx.clip();
}

// ── DRAW CORAL ────────────────────────────────────────────────────────────────
function drawCoral() {
  const DPR=devicePixelRatio, W=cC.width/DPR, H=cC.height/DPR;
  ctxC.clearRect(0,0,cC.width,cC.height);
  ctxC.fillStyle='#0a0e14'; ctxC.fillRect(0,0,cC.width,cC.height);

  const anchors = buildWarpAnchors();
  // coralView is in warped calendar year space (or raw if no anchors)
  drawGrid(ctxC, coralView, CORAL_Y, cC.width, cC.height, DPR);

  ctxC.save(); ctxC.scale(DPR,DPR);
  const pw=W-PAD.l-PAD.r, ph=H-PAD.t-PAD.b;
  ctxC.save(); clipRect(ctxC,W,H,1); // clip in CSS px space

  // ── X-ray bands ────────────────────────────────────────────────────────────
  if(document.getElementById('chk-xray').checked) {
    for(const x of XRAY) {
      // X-ray positions are in raw coral x; warp them
      const wx = warpX(x.age2_year ?? x.age2, anchors);
      const px = sxV(wx, coralView, W);
      if(px<PAD.l||px>PAD.l+pw) continue;
      ctxC.save();
      ctxC.strokeStyle = x.is_boundary ? 'rgba(210,168,255,0.55)' : 'rgba(210,168,255,0.18)';
      ctxC.lineWidth   = x.is_boundary ? 1.2 : 0.5;
      ctxC.setLineDash(x.is_boundary ? [4,3] : [2,4]);
      ctxC.beginPath(); ctxC.moveTo(px,PAD.t); ctxC.lineTo(px,PAD.t+ph); ctxC.stroke();
      ctxC.restore();
    }
  }

  // ── Climate overlay ─────────────────────────────────────────────────────────
  if(document.getElementById('chk-overlay').checked) {
    ctxC.save();
    ctxC.strokeStyle='rgba(78,205,196,0.45)'; ctxC.lineWidth=1.2; ctxC.lineJoin='round';
    ctxC.beginPath();
    let first=true;
    for(const p of CLIM_SERIES){
      const px=sxV(p.x,coralView,W), py=syY(climToCoral(p.y),CORAL_Y,H);
      if(px<PAD.l-2||px>PAD.l+pw+2){first=true;continue;}
      if(first){ctxC.moveTo(px,py);first=false;}else ctxC.lineTo(px,py);
    }
    ctxC.stroke(); ctxC.restore();
  }

  // ── Raw coral series ─────────────────────────────────────────────────────────
  ctxC.strokeStyle='rgba(224,92,92,0.45)'; ctxC.lineWidth=1; ctxC.lineJoin='round';
  ctxC.beginPath();
  let firstS=true;
  for(const p of CORAL_SERIES){
    const wx=warpX(p.x,anchors);
    const px=sxV(wx,coralView,W), py=syY(p.y,CORAL_Y,H);
    if(px<PAD.l-2||px>PAD.l+pw+2){firstS=true;continue;}
    if(firstS){ctxC.moveTo(px,py);firstS=false;}else ctxC.lineTo(px,py);
  }
  ctxC.stroke();

  // ── 3-pt MA ──────────────────────────────────────────────────────────────────
  if(document.getElementById('chk-ma').checked) {
    const ma = CORAL_SERIES.map((p,i)=>{
      const prev=CORAL_SERIES[i-1],next=CORAL_SERIES[i+1];
      const vals=[p.y]; if(prev)vals.push(prev.y); if(next)vals.push(next.y);
      return{x:p.x,y:vals.reduce((a,b)=>a+b,0)/vals.length};
    });
    ctxC.save();
    ctxC.strokeStyle='rgba(255,240,200,0.88)'; ctxC.lineWidth=2.5; ctxC.lineJoin='round';
    ctxC.beginPath(); let firstMA=true;
    for(const p of ma){
      const wx=warpX(p.x,anchors);
      const px=sxV(wx,coralView,W), py=syY(p.y,CORAL_Y,H);
      if(px<PAD.l-3||px>PAD.l+pw+3){firstMA=true;continue;}
      if(firstMA){ctxC.moveTo(px,py);firstMA=false;}else ctxC.lineTo(px,py);
    }
    ctxC.stroke(); ctxC.restore();
  }

  // ── Coral cycles ──────────────────────────────────────────────────────────
  const coralCycles=buildCoralCycles();
  for(const cyc of coralCycles){
    const isSel=selected?.which==='coral'&&selected.cycleId===cyc.id;
    const mp=matches.find(m=>m.coralId===cyc.id);
    const x0=sxV(warpX(cyc.start,anchors),coralView,W);
    const x1=sxV(warpX(cyc.end,  anchors),coralView,W);
    if(x1<PAD.l||x0>PAD.l+pw) continue;
    ctxC.fillStyle=isSel?'rgba(255,159,67,0.22)':mp?'rgba(139,92,246,0.15)':'rgba(224,92,92,0.04)';
    ctxC.fillRect(x0,PAD.t,x1-x0,ph);
    ctxC.strokeStyle=isSel?'rgba(255,159,67,0.55)':mp?'rgba(139,92,246,0.45)':'rgba(224,92,92,0.1)';
    ctxC.lineWidth=isSel||mp?1:0.4; ctxC.strokeRect(x0,PAD.t,x1-x0,ph);
    if(x1-x0>14){
      ctxC.fillStyle=isSel?'#ff9f43':mp?'#c4b5fd':'#2a3d52';
      ctxC.font=`${isSel||mp?'600 ':''}9px JetBrains Mono,monospace`; ctxC.textAlign='center';
      ctxC.fillText(cyc.id,(x0+x1)/2,PAD.t+13);
      if(mp&&x1-x0>22){
        const kc=CLIM_CYCLES.find(c=>c.id===mp.climId);
        ctxC.fillStyle='#7c3aed'; ctxC.font='8px JetBrains Mono,monospace';
        ctxC.fillText(kc?kc.peak_age.toFixed(1):'?',(x0+x1)/2,PAD.t+24);
      }
    }
    const wpx=sxV(warpX(cyc.peak_age,anchors),coralView,W);
    const wpy=syY(cyc.peak_val,CORAL_Y,H);
    ctxC.beginPath(); ctxC.arc(wpx,wpy,isSel?5:mp?4:3,0,Math.PI*2);
    ctxC.fillStyle=mp?'#8b5cf6':isSel?'#ff9f43':'#e05c5c'; ctxC.fill();
    if(isSel){ctxC.strokeStyle='#fff';ctxC.lineWidth=1.5;ctxC.stroke();}
  }

  // ── Boundary lines ─────────────────────────────────────────────────────────
  for(let i=0;i<coralBounds.length;i++){
    const wx=warpX(coralBounds[i],anchors);
    const bx=sxV(wx,coralView,W);
    if(bx<PAD.l-2||bx>PAD.l+pw+2) continue;
    const isEdge=(i===0||i===coralBounds.length-1);
    const isHov=hoverBoundIdx===i, isDrg=dragBoundIdx===i;
    if(isEdge&&mode!=='edit') continue;
    ctxC.save();
    ctxC.strokeStyle=isDrg?'#fff':isHov?'#f0b429':mode==='edit'?'rgba(240,180,41,0.65)':'rgba(240,180,41,0.18)';
    ctxC.lineWidth=isDrg||isHov?2:1;
    if(isEdge) ctxC.setLineDash([4,3]);
    ctxC.beginPath();ctxC.moveTo(bx,PAD.t);ctxC.lineTo(bx,PAD.t+ph);ctxC.stroke();
    ctxC.restore();
    if(mode==='edit'&&!isEdge){
      ctxC.beginPath();ctxC.arc(bx,H/2,5,0,Math.PI*2);
      ctxC.fillStyle=isDrg?'#fff':isHov?'#f0b429':'rgba(240,180,41,0.4)';ctxC.fill();
    }
  }

  ctxC.restore(); // unclip
  ctxC.restore(); // unscale
  document.getElementById('coral-count').textContent=coralCycles.length;
}

      ctxK.font=`${isSel||mp?'600 ':''}9px JetBrains Mono,monospace`; ctxK.textAlign='center';
      ctxK.fillText(cyc.id,(x0+x1)/2,PAD.t+13);
      if(mp&&x1-x0>22){ctxK.fillStyle='#7c3aed';ctxK.font='8px JetBrains Mono,monospace';ctxK.fillText(cyc.peak_age.toFixed(1),(x0+x1)/2,PAD.t+24);}
    }
    const px=sxV(cyc.peak_age,climView,W), py=syY(cyc.peak_val,CLIM_Y,H);
    ctxK.beginPath();ctxK.arc(px,py,isSel?5:mp?4:3,0,Math.PI*2);
    ctxK.fillStyle=mp?'#8b5cf6':isSel?'#74b9ff':'#4ecdc4';ctxK.fill();
    if(isSel){ctxK.strokeStyle='#fff';ctxK.lineWidth=1.5;ctxK.stroke();}
  }

  ctxK.restore(); ctxK.restore();
}

function draw() { drawCoral(); drawClim(); document.getElementById('matched-count').textContent=matches.length; updateCorr(); }

// ── CORRELATION ───────────────────────────────────────────────────────────────
function interpClim(yr) {
  for(let i=0;i<CLIM_SERIES.length-1;i++){
    const a=CLIM_SERIES[i],b=CLIM_SERIES[i+1];
    if(yr>=a.x&&yr<=b.x) return a.y+(b.y-a.y)*(yr-a.x)/(b.x-a.x);
  }
  return null;
}

function updateCorr() {
  const anchors=buildWarpAnchors();
  if(!anchors||matches.length<2){document.getElementById('corr-val').textContent='—';return;}
  const xs=[],ys=[];
  for(const p of CORAL_SERIES){
    const wy=warpX(p.x,anchors);
    const cd=interpClim(wy); if(cd===null) continue;
    xs.push(p.y); ys.push(cd);
  }
  if(xs.length<10){document.getElementById('corr-val').textContent='—';return;}
  const mx=xs.reduce((a,b)=>a+b)/xs.length, my=ys.reduce((a,b)=>a+b)/ys.length;
  let num=0,dx2=0,dy2=0;
  for(let i=0;i<xs.length;i++){const dx=xs[i]-mx,dy=ys[i]-my;num+=dx*dy;dx2+=dx*dx;dy2+=dy*dy;}
  const r=num/Math.sqrt(dx2*dy2);
  const el=document.getElementById('corr-val');
  el.textContent=isNaN(r)?'—':r.toFixed(3);
  el.style.color=r>0.7?'#56d364':r>0.4?'#f0b429':'#e05c5c';
}

// ── PAN / ZOOM ────────────────────────────────────────────────────────────────
function getMx(canvas,e) { return e.clientX-canvas.getBoundingClientRect().left; }

// Pan drag — works in both modes except when edit-dragging a boundary
let panDrag=null;

cC.addEventListener('mousedown', e => {
  if(mode==='edit'){
    const mx=getMx(cC,e), idx=nearBound(mx);
    if(idx!==null){save();dragBoundIdx=idx;cC.style.cursor='ew-resize';e.preventDefault();return;}
  }
  if(mode==='match'){
    // click handling done in click event; don't start pan on clicks
    // only start pan if this turns into a drag
    panDrag={chart:'coral',startX:e.clientX,startMin:coralView.xMin,startMax:coralView.xMax,moved:false};
    return;
  }
  panDrag={chart:'coral',startX:e.clientX,startMin:coralView.xMin,startMax:coralView.xMax,moved:false};
});
cK.addEventListener('mousedown', e => {
  panDrag={chart:'clim',startX:e.clientX,startMin:climView.xMin,startMax:climView.xMax,moved:false};
});

window.addEventListener('mousemove', e => {
  // Edit drag boundary
  if(mode==='edit'&&dragBoundIdx!==null){
    const mx=getMx(cC,e);
    const anchors=buildWarpAnchors();
    const W=cC.clientWidth;
    // current display x → calendar year → unwarp → raw coral x
    const calX=invSxV(mx,coralView,W);
    let rawX=anchors?unwarpX(calX,anchors):calX;
    const lo=coralBounds[dragBoundIdx-1]??extCoralRaw.xMin;
    const hi=coralBounds[dragBoundIdx+1]??extCoralRaw.xMax;
    coralBounds[dragBoundIdx]=Math.max(lo+0.001,Math.min(hi-0.001,rawX));
    matches=matches.filter(m=>m.coralId!==dragBoundIdx&&m.coralId!==dragBoundIdx+1);
    draw(); return;
  }
  // Pan drag
  if(!panDrag) return;
  const dx=e.clientX-panDrag.startX;
  if(Math.abs(dx)>2) panDrag.moved=true;
  if(!panDrag.moved) return;
  const W=panDrag.chart==='coral'?cC.clientWidth:cK.clientWidth;
  const span=panDrag.startMax-panDrag.startMin;
  const dyr=dx/W*span;
  if(panDrag.chart==='coral') coralView={xMin:panDrag.startMin-dyr,xMax:panDrag.startMax-dyr};
  else                         climView ={xMin:panDrag.startMin-dyr,xMax:panDrag.startMax-dyr};
  draw();
});
window.addEventListener('mouseup', () => {
  if(dragBoundIdx!==null){dragBoundIdx=null;cC.style.cursor='crosshair';draw();}
  panDrag=null;
});

// Zoom
function zoomView(view, yr, factor) {
  return{xMin:yr+(view.xMin-yr)*factor, xMax:yr+(view.xMax-yr)*factor};
}
cC.addEventListener('wheel', e => {
  e.preventDefault();
  const W=cC.clientWidth, mx=getMx(cC,e);
  const yr=invSxV(mx,coralView,W);
  const factor=e.deltaY>0?1.12:0.88;
  coralView=zoomView(coralView,yr,factor); draw();
},{passive:false});
cK.addEventListener('wheel', e => {
  e.preventDefault();
  const W=cK.clientWidth, mx=getMx(cK,e);
  const yr=invSxV(mx,climView,W);
  const factor=e.deltaY>0?1.12:0.88;
  climView=zoomView(climView,yr,factor); draw();
},{passive:false});

// ── HIT TESTS ─────────────────────────────────────────────────────────────────
function hitCoralCycle(mx) {
  const W=cC.clientWidth, anchors=buildWarpAnchors();
  for(const cyc of buildCoralCycles()){
    const x0=sxV(warpX(cyc.start,anchors),coralView,W);
    const x1=sxV(warpX(cyc.end,  anchors),coralView,W);
    if(mx>=x0&&mx<=x1) return cyc;
  }
  return null;
}
function hitClimCycle(mx) {
  const W=cK.clientWidth;
  for(const c of CLIM_CYCLES){
    if(mx>=sxV(c.start,climView,W)&&mx<=sxV(c.end,climView,W)) return c;
  }
  return null;
}
function nearBound(mx) {
  const W=cC.clientWidth, anchors=buildWarpAnchors();
  let best=null, bd=Infinity;
  for(let i=0;i<coralBounds.length;i++){
    if(i===0||i===coralBounds.length-1) continue;
    const bx=sxV(warpX(coralBounds[i],anchors),coralView,W);
    const d=Math.abs(mx-bx);
    if(d<bd){bd=d;best=i;}
  }
  return bd<=SNAP_PX?best:null;
}

// Hover for boundary handle in edit mode
cC.addEventListener('mousemove', e => {
  if(mode==='match'){moveTip('coral',e);return;}
  if(dragBoundIdx!==null) return; // handled above
  const mx=getMx(cC,e), idx=nearBound(mx);
  if(idx!==hoverBoundIdx){hoverBoundIdx=idx;draw();}
  cC.style.cursor=idx!==null?'ew-resize':'crosshair';
});
cC.addEventListener('mouseleave',()=>{hoverBoundIdx=null;tooltip.style.display='none';if(mode!=='edit')draw();});
cK.addEventListener('mousemove',e=>moveTip('clim',e));
cK.addEventListener('mouseleave',()=>{tooltip.style.display='none';});

// ── MATCH CLICKS ─────────────────────────────────────────────────────────────
cC.addEventListener('click', e => {
  if(mode!=='match') return;
  if(panDrag?.moved) return; // was a pan drag
  const mx=getMx(cC,e), cyc=hitCoralCycle(mx);
  if(!cyc){selected=null;draw();return;}
  if(!selected){selected={which:'coral',cycleId:cyc.id};setStatus(`Coral band #${cyc.id} selected → click matching climate cycle`);draw();return;}
  if(selected.which==='coral'){selected={which:'coral',cycleId:cyc.id};setStatus(`Coral band #${cyc.id} selected → click matching climate cycle`);draw();return;}
  doMatch(cyc.id,selected.cycleId);
});
cK.addEventListener('click', e => {
  if(mode!=='match') return;
  if(panDrag?.moved) return;
  const mx=getMx(cK,e), cyc=hitClimCycle(mx);
  if(!cyc){selected=null;draw();return;}
  if(!selected){selected={which:'clim',cycleId:cyc.id};setStatus(`Climate #${cyc.id} (${cyc.peak_age.toFixed(2)}) selected → click matching coral band`);draw();return;}
  if(selected.which==='clim'){selected={which:'clim',cycleId:cyc.id};setStatus(`Climate #${cyc.id} (${cyc.peak_age.toFixed(2)}) selected → click matching coral band`);draw();return;}
  doMatch(selected.cycleId,cyc.id);
});

function doMatch(coralId,climId) {
  save();
  matches=matches.filter(m=>m.coralId!==coralId&&m.climId!==climId);
  matches.push({coralId,climId});
  selected=null;
  const kc=CLIM_CYCLES.find(c=>c.id===climId);
  setStatus(`✓ Band #${coralId} ↔ ${kc?kc.peak_age.toFixed(2):climId} — coral axis updated`);
  draw();
}
cC.addEventListener('contextmenu',e=>{
  e.preventDefault();if(mode!=='match')return;
  const mx=getMx(cC,e),cyc=hitCoralCycle(mx);if(!cyc)return;
  save();matches=matches.filter(m=>m.coralId!==cyc.id);
  setStatus(`Removed match for band #${cyc.id}`);draw();
});
cK.addEventListener('contextmenu',e=>{
  e.preventDefault();
  const mx=getMx(cK,e),cyc=hitClimCycle(mx);if(!cyc)return;
  save();matches=matches.filter(m=>m.climId!==cyc.id);
  setStatus(`Removed match for climate #${cyc.id}`);draw();
});

// ── EDIT MODE CLICKS ──────────────────────────────────────────────────────────
let _lastDown={x:0,t:0};
cC.addEventListener('mousedown',e=>{_lastDown={x:e.clientX,t:Date.now()};} );
cC.addEventListener('click',e=>{
  if(mode!=='edit') return;
  if(Math.abs(e.clientX-_lastDown.x)>4) return;
  const mx=getMx(cC,e);
  if(nearBound(mx)!==null) return;
  const W=cC.clientWidth;
  const anchors=buildWarpAnchors();
  const calX=invSxV(mx,coralView,W);
  const rawX=anchors?unwarpX(calX,anchors):calX;
  if(rawX<=extCoralRaw.xMin||rawX>=extCoralRaw.xMax) return;
  save();
  let ins=coralBounds.findIndex(b=>b>rawX);
  if(ins===-1) ins=coralBounds.length-1;
  coralBounds.splice(ins,0,rawX);
  matches=matches.map(m=>({...m,coralId:m.coralId>=ins?m.coralId+1:m.coralId}));
  setStatus(`Added boundary — ${coralBounds.length-1} bands`);draw();
});
cC.addEventListener('dblclick',e=>{
  if(mode!=='edit') return;
  const mx=getMx(cC,e),idx=nearBound(mx);if(idx===null)return;
  save();
  matches=matches.filter(m=>m.coralId!==idx&&m.coralId!==idx+1);
  coralBounds.splice(idx,1);
  matches=matches.map(m=>({...m,coralId:m.coralId>idx?m.coralId-1:m.coralId}));
  setStatus(`Deleted boundary — ${coralBounds.length-1} bands`);draw();
});

// ── TOOLTIP ───────────────────────────────────────────────────────────────────
const tooltip=document.getElementById('tooltip');
function moveTip(which,e) {
  const mx=getMx(which==='coral'?cC:cK,e);
  const cyc=which==='coral'?hitCoralCycle(mx):hitClimCycle(mx);
  if(!cyc){tooltip.style.display='none';return;}
  const mp=matches.find(m=>which==='coral'?m.coralId===cyc.id:m.climId===cyc.id);
  let h=`<b style="color:${which==='coral'?'#e05c5c':'#4ecdc4'}">${which.toUpperCase()} #${cyc.id}</b><br>Peak: ${cyc.peak_age.toFixed(3)}<br>Val: ${cyc.peak_val.toFixed(4)}<br>Span: ${(cyc.end-cyc.start).toFixed(3)} yr`;
  if(mp){const other=which==='coral'?CLIM_CYCLES.find(c=>c.id===mp.climId):buildCoralCycles().find(c=>c.id===mp.coralId);h+=`<br><span style="color:#c4b5fd">↔ ${which==='coral'?'climate':'coral'} #${which==='coral'?mp.climId:mp.coralId}</span>`;if(other&&which==='coral')h+=` (${other.peak_age.toFixed(2)})`;}
  tooltip.innerHTML=h;tooltip.style.display='block';
  tooltip.style.left=(e.clientX+14)+'px';tooltip.style.top=(e.clientY-10)+'px';
}

// ── MODE ──────────────────────────────────────────────────────────────────────
function setMode(m) {
  mode=m;selected=null;dragBoundIdx=null;hoverBoundIdx=null;
  document.getElementById('btn-match').className='btn'+(m==='match'?' active':'');
  document.getElementById('btn-edit').className='btn'+(m==='edit'?' active-edit':'');
  cC.style.cursor='crosshair';
  setStatus(m==='match'?'Match mode: click coral band → click climate cycle · right-click to remove · drag to pan · scroll to zoom'
    :'Edit bands: drag boundaries · click to add · double-click to delete · drag to pan');
  draw();
}

// ── HISTORY ───────────────────────────────────────────────────────────────────
function save(){history.push({matches:JSON.parse(JSON.stringify(matches)),bounds:[...coralBounds]});}
function undoLast(){
  if(!history.length){setStatus('Nothing to undo');return;}
  const p=history.pop();matches=p.matches;coralBounds=p.bounds;selected=null;draw();setStatus('Undone');
}
function clearAll(){
  if(!matches.length){setStatus('No matches to clear');return;}
  save();matches=[];selected=null;draw();setStatus('Cleared all matches');
}

// ── KEYBOARD ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){selected=null;draw();setStatus('Cancelled');}
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undoLast();}
});

// ── EXPORT / IMPORT ───────────────────────────────────────────────────────────
function exportCSV(){
  const cycs=buildCoralCycles(), anchors=buildWarpAnchors();
  let csv='coral_cycle_id,coral_start_raw,coral_end_raw,coral_peak_raw,coral_peak_d18o,clim_cycle_id,clim_peak_age,calendar_year_start,calendar_year_end\n';
  for(const cc of cycs){
    const mp=matches.find(m=>m.coralId===cc.id);
    const kc=mp?CLIM_CYCLES.find(c=>c.id===mp.climId):null;
    const cs=anchors?warpX(cc.start,anchors):'';
    const ce=anchors?warpX(cc.end,  anchors):'';
    csv+=`${cc.id},${cc.start.toFixed(5)},${cc.end.toFixed(5)},${cc.peak_age.toFixed(5)},${cc.peak_val.toFixed(5)},${mp?mp.climId:''},${kc?kc.peak_age.toFixed(5):''},${cs!==''?cs.toFixed(5):''},${ce!==''?ce.toFixed(5):''}\n`;
  }
  csv+=`# MATCHES:${JSON.stringify(matches)}\n# BOUNDS:${JSON.stringify(coralBounds)}\n`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='coral_age_matches.csv';a.click();
  setStatus(`Exported ${cycs.length} cycles (${matches.length} matched)`);
}
function importCSV(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const lines=e.target.result.split('\n');
      let nm=null,nb=null;
      for(const l of lines){
        if(l.startsWith('# MATCHES:'))nm=JSON.parse(l.slice(10));
        if(l.startsWith('# BOUNDS:'))nb=JSON.parse(l.slice(9));
      }
      if(nm&&nb){save();matches=nm;coralBounds=nb;selected=null;draw();setStatus(`✓ Imported ${nm.length} matches, ${nb.length} boundaries`);}
      else setStatus('Import: no embedded state found');
    }catch(err){setStatus('Import error: '+err.message);}
  };
  reader.readAsText(file);
}

function setStatus(msg){document.getElementById('status').textContent=msg;}

window.addEventListener('resize',resize);
resize();
</script>
