<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Full Coral Age Editor v3</title>
<style>
  :root{
    --bg:#0a0e14;--panel:#111720;--border:#1e2a38;
    --text:#cdd6e0;--muted:#4a6075;--accent:#56d364;--warn:#f0b429;
    --clim:#4ecdc4;--synth:#f5a623;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--bg);color:var(--text);
    font-family:'JetBrains Mono',monospace,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;}

  #toolbar{background:var(--panel);border-bottom:1px solid var(--border);
    padding:5px 12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;
    flex-shrink:0;font-size:11px;}
  .sep{width:1px;height:22px;background:var(--border);margin:0 2px;flex-shrink:0;}
  .btn{background:transparent;border:1px solid var(--border);color:var(--muted);
    padding:4px 10px;border-radius:3px;cursor:pointer;
    font:11px/1 'JetBrains Mono',monospace;transition:all .12s;white-space:nowrap;}
  .btn:hover{border-color:var(--text);color:var(--text);}
  .btn.save-btn{border-color:#1a3a1a;color:var(--accent);}
  .btn.save-btn:hover{background:#1a2e1a;}
  .btn.snap-btn{border-color:#1a2f1a;color:#7dd87d;}
  .btn.io{border-color:#1e2a38;color:#74b9ff;}
  .btn.io:hover{background:#0e1e2e;}
  .chk{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);
    cursor:pointer;white-space:nowrap;}
  .chk input{accent-color:var(--clim);cursor:pointer;}
  .chk:hover{color:var(--text);}
  #stats{margin-left:auto;display:flex;gap:12px;font-size:10px;color:var(--muted);}
  #stats b{color:var(--accent);font-weight:600;}
  .rg{color:var(--clim)!important;}
  .rp{color:var(--synth)!important;}

  #main{flex:1;display:flex;min-height:0;}
  #canvas-col{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;}
  #wrap-main{flex:3;min-height:0;position:relative;
    border-bottom:1px solid var(--border);overflow:hidden;}
  #wrap-main canvas{display:block;width:100%;height:100%;}
  #wrap-clim{flex:1;min-height:0;position:relative;overflow:hidden;}
  #wrap-clim canvas{display:block;width:100%;height:100%;}
  .chart-label{position:absolute;top:4px;left:8px;font-size:9px;
    color:var(--muted);pointer-events:none;}

  #sidebar{width:215px;flex-shrink:0;background:var(--panel);
    border-left:1px solid var(--border);display:flex;flex-direction:column;
    font-size:10px;overflow:hidden;}
  #sidebar h3{padding:7px 10px;font-size:10px;color:var(--muted);
    border-bottom:1px solid var(--border);letter-spacing:.05em;font-weight:normal;}
  #sample-list{flex:1;overflow-y:auto;padding:2px 0;}
  .sr{padding:2px 8px;cursor:pointer;display:flex;
    justify-content:space-between;border-left:2px solid transparent;line-height:1.6;}
  .sr:hover{background:#151f2a;}
  .sr.sel{background:#1a2535;border-left-color:var(--warn);}
  .sr.mod{background:#131808;}
  .sn{font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sa{font-size:9px;color:var(--accent);}

  #edit-panel{border-top:1px solid var(--border);padding:9px 10px;font-size:10px;}
  #edit-panel label{color:var(--muted);display:block;margin-bottom:3px;}
  #age-input{width:100%;background:#0c1520;border:1px solid var(--border);
    color:var(--text);padding:4px 6px;border-radius:3px;
    font:11px/1 'JetBrains Mono',monospace;}
  #age-input:focus{outline:none;border-color:var(--warn);}
  #age-slider{width:100%;margin:5px 0;accent-color:var(--warn);}
  .ei{color:var(--muted);font-size:9px;line-height:1.8;margin-top:4px;}
  .ei b{color:var(--text);}
  /* snap button inside edit panel */
  #snap-season{width:100%;margin-top:6px;padding:5px;border-radius:3px;
    background:#1a1f0a;border:1px solid #3a5a0a;color:#a8d060;
    cursor:pointer;font:10px/1 'JetBrains Mono',monospace;}
  #snap-season:hover{background:#222f0e;}

  #statusbar{background:var(--panel);border-top:1px solid var(--border);
    padding:4px 12px;font-size:10px;color:var(--muted);flex-shrink:0;}
  #tooltip{position:fixed;background:#0c1520;border:1px solid var(--border);
    border-radius:4px;padding:5px 8px;font-size:10px;line-height:1.7;
    pointer-events:none;display:none;z-index:999;}
  #sample-list::-webkit-scrollbar{width:4px;}
  #sample-list::-webkit-scrollbar-track{background:var(--bg);}
  #sample-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>
</head>
<body>

<div id="toolbar">
  <button class="btn save-btn" onclick="saveSnap()">💾 Save &amp; r</button>
  <button class="btn" onclick="resetAll()">↩ Reset all</button>
  <div class="sep"></div>
  <button class="btn io" onclick="exportCSV()">↓ Export CSV</button>
  <label class="btn io" style="cursor:pointer">↑ Import CSV
    <input type="file" id="imp" accept=".csv" style="display:none" onchange="importCSV(event)">
  </label>
  <div class="sep"></div>
  <label class="chk"><input type="checkbox" id="chk-clim" checked onchange="draw()"> Climate</label>
  <label class="chk"><input type="checkbox" id="chk-ma"   checked onchange="draw()"> MA</label>
  <label class="chk"><input type="checkbox" id="chk-tp"   checked onchange="draw()"> Tie pts</label>
  <label class="chk"><input type="checkbox" id="chk-mod"  checked onchange="draw()"> Edits</label>
  <label class="chk"><input type="checkbox" id="chk-pre"  checked onchange="draw()"> Pre-1958 zone</label>
  <div id="stats">
    <div>r post-58: <b id="r-post" class="rg">—</b></div>
    <div>r pre-58: <b id="r-pre" class="rp">—</b></div>
    <div>mod: <b id="n-mod">0</b></div>
    <div>snaps: <b id="n-snap">0</b></div>
  </div>
</div>

<div id="main">
  <div id="canvas-col">
    <div id="wrap-main">
      <canvas id="cm"></canvas>
      <div class="chart-label">δ¹⁸O PDB — drag dot · scroll zoom · drag bg to pan · ←→ nudge (Shift=×5, Alt=÷10)</div>
    </div>
    <div id="wrap-clim">
      <canvas id="ck"></canvas>
      <div class="chart-label">Climate — orange=synthetic AR(1) · teal=observed ORAS5</div>
    </div>
  </div>
  <div id="sidebar">
    <h3 id="path-header">ALL PATHS (574)</h3>
    <div id="sample-list"></div>
    <div id="edit-panel">
      <label>Calendar year</label>
      <input type="number" id="age-input" step="0.001" placeholder="—"
             oninput="onAgeIn()" onchange="onAgeIn()">
      <input type="range" id="age-slider" step="0.001"
             oninput="onSlide()" onchange="onSlide()">
      <button id="snap-season" onclick="snapToSeason()">
        ⟳ Snap to correct season
      </button>
      <div class="ei" id="edit-info">Click a dot to select and edit.</div>
    </div>
  </div>
</div>
<div id="statusbar"><span id="status">Ready — 574 samples · pre-1958 shown with synthetic climate</span></div>
<div id="tooltip"></div>

// ── CANVAS ───────────────────────────────────────────────────────────────────
const cmEl=document.getElementById('cm');

const cm=cmEl.getContext('2d');

function resize(){
  cmEl.width=document.getElementById('wrap-main').clientWidth;
  cmEl.height=document.getElementById('wrap-main').clientHeight;
  ckEl.width=document.getElementById('wrap-clim').clientWidth;
  ckEl.height=document.getElementById('wrap-clim').clientHeight;
  draw();
}
new ResizeObserver(resize).observe(document.getElementById('wrap-main'));
new ResizeObserver(resize).observe(document.getElementById('wrap-clim'));

// ── COORDS ───────────────────────────────────────────────────────────────────
function toX(age,W){return (age-X_MIN)/(X_MAX-X_MIN)*W*zoom+pan;}
function fromX(px,W){return X_MIN+(px-pan)/zoom/W*(X_MAX-X_MIN);}
function toY(v,lo,hi,H,mg=28){return mg+(1-(v-lo)/(hi-lo))*(H-2*mg);}

// ── DRAW ─────────────────────────────────────────────────────────────────────
const BG='#111720', GRID='#1a2535', TICK='#4a6075';

function getScaling(){
  const allv=ALL_SAMPS.filter(s=>s.d18o_pdb!=null).map(s=>s.d18o_pdb);
  const dMean=allv.reduce((a,b)=>a+b,0)/allv.length;
  const dStd=Math.sqrt(allv.reduce((s,v)=>s+(v-dMean)**2,0)/allv.length);
  const cv=CLIM.map(p=>p.y);
  const cMean=cv.reduce((a,b)=>a+b,0)/cv.length;
  const cStd=Math.sqrt(cv.reduce((s,v)=>s+(v-cMean)**2,0)/cv.length);
  return {sca:dStd/cStd, scb:dMean-dStd/cStd*cMean};
}

function draw(){drawMain();drawClim();updateSidebar();updateStats();}

function drawMain(){
  const W=cmEl.width,H=cmEl.height;
  cm.fillStyle=BG; cm.fillRect(0,0,W,H);

  const {sca,scb}=getScaling();
  const showPre=document.getElementById('chk-pre').checked;

  // compute y range from visible
  const vis=ALL_SAMPS.filter(s=>{
    const x=toX(ageMap[s.name],W); return x>-10&&x<W+10&&s.d18o_pdb!=null;
  });
  let vmin=-5.9,vmax=-4.0;
  if(vis.length){
    vmin=Math.min(...vis.map(s=>s.d18o_pdb))-0.06;
    vmax=Math.max(...vis.map(s=>s.d18o_pdb))+0.06;
  }
  if(document.getElementById('chk-clim').checked){
    const xlo=fromX(0,W),xhi=fromX(W,W);
    const cv=CLIM.filter(p=>p.x>=xlo&&p.x<=xhi).map(p=>p.y*sca+scb);
    if(cv.length){vmin=Math.min(vmin,...cv);vmax=Math.max(vmax,...cv);}
  }
  gVmin=vmin; gVmax=vmax;

  drawXAxis(cm,W,H);

  // Pre-1958 shaded zone
  if(showPre){
    const x1=toX(X_MIN,W), x2=toX(1958.04,W);
    cm.fillStyle='rgba(245,166,35,0.06)';
    cm.fillRect(Math.max(0,x1),0,Math.min(W,x2)-Math.max(0,x1),H);
    cm.strokeStyle='rgba(245,166,35,0.3)'; cm.lineWidth=1; cm.setLineDash([3,6]);
    const xb=toX(1958.04,W);
    if(xb>0&&xb<W){cm.beginPath();cm.moveTo(xb,0);cm.lineTo(xb,H);cm.stroke();}
    cm.setLineDash([]);
    cm.fillStyle='rgba(245,166,35,0.45)'; cm.font='8px monospace';
    if(xb>40) cm.fillText('← synthetic climate',Math.max(4,xb-120),12);
  }

  // Tie-point lines
  if(document.getElementById('chk-tp').checked){
    cm.setLineDash([3,5]);
    for(const t of TP_CAL){
      const x=toX(t,W); if(x<0||x>W) continue;
      cm.strokeStyle='rgba(240,180,41,0.4)'; cm.lineWidth=1;
      cm.beginPath(); cm.moveTo(x,0); cm.lineTo(x,H); cm.stroke();
      cm.fillStyle='rgba(240,180,41,0.45)'; cm.font='8px monospace';
      cm.fillText(t.toFixed(1),x+2,11);
    }
    cm.setLineDash([]);
  }

  // Climate overlay
  if(document.getElementById('chk-clim').checked){
    // draw synthetic and observed in different colours
    let firstS=true,firstO=true;
    cm.lineWidth=1.4; cm.setLineDash([]);
    cm.beginPath(); cm.strokeStyle='rgba(245,166,35,0.55)';
    for(const p of CLIM){
      if(!p.synth) continue;
      const x=toX(p.x,W); if(x<-5||x>W+5){firstS=true;continue;}
      const y=toY(p.y*sca+scb,vmin,vmax,H);
      if(firstS){cm.moveTo(x,y);firstS=false;}else cm.lineTo(x,y);
    }
    cm.stroke();
    cm.beginPath(); cm.strokeStyle='rgba(78,205,196,0.5)';
    for(const p of CLIM){
      if(p.synth) continue;
      const x=toX(p.x,W); if(x<-5||x>W+5){firstO=true;continue;}
      const y=toY(p.y*sca+scb,vmin,vmax,H);
      if(firstO){cm.moveTo(x,y);firstO=false;}else cm.lineTo(x,y);
    }
    cm.stroke();

        .sort((a,b)=>a.age-b.age);
      if(psamps.length<2) continue;
      cm.lineWidth=1.5; cm.setLineDash([]);
      let started=false;
      cm.beginPath(); cm.strokeStyle=pc(pth);
      for(let i=0;i<psamps.length;i++){
        const x=toX(psamps[i].age,W);
        if(x<-5||x>W+5){started=false;continue;}
        const hw=Math.floor(MA/2),l2=Math.max(0,i-hw),h2=Math.min(psamps.length-1,i+hw);
        const avg=psamps.slice(l2,h2+1).reduce((s,p)=>s+p.val,0)/(h2-l2+1);
        const y=toY(avg,vmin,vmax,H);
        if(!started){cm.moveTo(x,y);started=true;}else cm.lineTo(x,y);
      }
      cm.stroke();
    }
  }

  // Dots
  const showMod=document.getElementById('chk-mod').checked;
  for(let i=0;i<ALL_SAMPS.length;i++){
    const s=ALL_SAMPS[i]; if(s.d18o_pdb==null) continue;
    const age=ageMap[s.name];
    const x=toX(age,W); if(x<-8||x>W+8) continue;
    const y=toY(s.d18o_pdb,vmin,vmax,H);
    const isSel=(i===selIdx);
    const isMod=showMod&&Math.abs(age-s.age_orig)>0.0005;
    const col=isSel?'#fff':isMod?'#f0b429':pc(s.path);
    const r=isSel?6:s.pre1958?2.5:3;
    cm.beginPath(); cm.arc(x,y,r,0,6.28);
    cm.fillStyle=col; cm.fill();
    if(isSel){
      cm.strokeStyle=pc(s.path); cm.lineWidth=2; cm.stroke();
      const{lo,hi}=getConstraint(i);
      cm.fillStyle='rgba(240,180,41,0.07)';
      cm.fillRect(toX(lo,W),0,toX(hi,W)-toX(lo,W),H);
      cm.strokeStyle='rgba(255,255,255,0.18)'; cm.lineWidth=1; cm.setLineDash([2,4]);
      cm.beginPath(); cm.moveTo(x,0); cm.lineTo(x,H); cm.stroke();
      cm.setLineDash([]);
    }
  }

  // Path legend
  const paths=[...new Set(ALL_SAMPS.map(s=>s.path))].sort();
  cm.font='9px monospace'; cm.textAlign='right';
  paths.forEach((pth,pi)=>{
    cm.fillStyle=pc(pth);
    cm.fillRect(W-36,10+pi*13,9,9);
    cm.fillText('Path '+pth,W-5,19+pi*13);
  });
  cm.textAlign='left';
  cm.fillStyle=TICK; cm.font='9px monospace'; cm.fillText('δ¹⁸O PDB (‰)',4,14);
}

function drawClim(){
  const W=ckEl.width,H=ckEl.height;
  ck.fillStyle=BG; ck.fillRect(0,0,W,H);
  const cy2=CLIM.map(p=>p.y);
  const cvmin=Math.min(...cy2)-0.05, cvmax=Math.max(...cy2)+0.05;
  drawXAxis(ck,W,H);

  // Synthetic segment bg
  if(document.getElementById('chk-pre').checked){
    const x1=toX(X_MIN,W),x2=toX(1958.04,W);
    ck.fillStyle='rgba(245,166,35,0.07)';
    ck.fillRect(Math.max(0,x1),0,Math.min(W,x2)-Math.max(0,x1),H);
  }

  // Climate lines
  let fS=true,fO=true;
  ck.lineWidth=1.4;
  ck.beginPath(); ck.strokeStyle='#f5a623';
  for(const p of CLIM){
    if(!p.synth) continue;
    const x=toX(p.x,W); if(x<-5||x>W+5){fS=true;continue;}
    const y=toY(p.y,cvmin,cvmax,H);
    if(fS){ck.moveTo(x,y);fS=false;}else ck.lineTo(x,y);
  }
  ck.stroke();
  ck.beginPath(); ck.strokeStyle='#4ecdc4';
  for(const p of CLIM){
    if(p.synth) continue;
    const x=toX(p.x,W); if(x<-5||x>W+5){fO=true;continue;}
    const y=toY(p.y,cvmin,cvmax,H);
    if(fO){ck.moveTo(x,y);fO=false;}else ck.lineTo(x,y);
  }
  ck.stroke();

  // Tie pts
  if(document.getElementById('chk-tp').checked){
    ck.setLineDash([3,5]);
    for(const t of TP_CAL){
      const x=toX(t,W); if(x<0||x>W) continue;
      ck.strokeStyle='rgba(240,180,41,0.35)'; ck.lineWidth=1;
      ck.beginPath(); ck.moveTo(x,0); ck.lineTo(x,H); ck.stroke();
    }
    ck.setLineDash([]);
  }

  // Cursor
  if(selIdx>=0){
    const x=toX(ageMap[ALL_SAMPS[selIdx].name],W);
    ck.strokeStyle='rgba(255,255,255,0.2)'; ck.lineWidth=1; ck.setLineDash([2,4]);
    ck.beginPath(); ck.moveTo(x,0); ck.lineTo(x,H); ck.stroke();
    ck.setLineDash([]);
  }
  ck.fillStyle=TICK; ck.font='9px monospace';
  ck.fillText('Climate δ¹⁸O',4,14);
}

function drawXAxis(ctx,W,H){
  const lo=fromX(0,W),hi=fromX(W,W),span=hi-lo;
  const step=span>40?10:span>15?5:span>6?2:1;
  const start=Math.ceil(lo/step)*step;
  ctx.strokeStyle=GRID; ctx.lineWidth=1; ctx.setLineDash([]);
  ctx.fillStyle=TICK; ctx.font='8px monospace'; ctx.textAlign='center';
  for(let t=start;t<=hi;t+=step){
    const x=toX(t,W);
    ctx.beginPath(); ctx.moveTo(x,H-14); ctx.lineTo(x,H); ctx.stroke();
    ctx.fillText(t.toFixed(0),x,H-3);
  }
  ctx.textAlign='left';
}

// ── CONSTRAINTS ───────────────────────────────────────────────────────────────
function getConstraint(idx){
  const s=ALL_SAMPS[idx];
  let segLo=X_MIN, segHi=X_MAX;
  for(const t of TP_CAL){if(t<=s.age_orig) segLo=t;}
  for(const t of [...TP_CAL].reverse()){if(t>=s.age_orig) segHi=t;}
  let lo=segLo+0.001, hi=segHi-0.001;
  for(let j=0;j<ALL_SAMPS.length;j++){
    if(j===idx||ALL_SAMPS[j].path!==s.path) continue;
    const age=ageMap[ALL_SAMPS[j].name];
    if(ALL_SAMPS[j].path_num<s.path_num) lo=Math.max(lo,age+MIN_DT);
    if(ALL_SAMPS[j].path_num>s.path_num) hi=Math.min(hi,age-MIN_DT);
  }
  return{lo,hi};
}
function clamp(idx,v){const{lo,hi}=getConstraint(idx);return Math.max(lo,Math.min(hi,v));}

// ── SNAP TO SEASON ────────────────────────────────────────────────────────────
function snapToSeason(){
  if(selIdx<0){setStatus('Select a sample first');return;}
  const s=ALL_SAMPS[selIdx];
  if(s.d18o_pdb==null){setStatus('No d18O value — cannot snap');return;}

  // Normalise sample's d18o relative to its path
  const pathSamps=ALL_SAMPS.filter(x=>x.path===s.path&&x.d18o_pdb!=null);
  const pm=pathSamps.reduce((a,b)=>a+b.d18o_pdb,0)/pathSamps.length;
  const ps=Math.sqrt(pathSamps.reduce((a,b)=>a+(b.d18o_pdb-pm)**2,0)/pathSamps.length);
  const z=(s.d18o_pdb-pm)/ps;

  // Find best matching calendar month
  let bestMo=1, bestScore=-Infinity;
  for(let mo=1;mo<=12;mo++){
    const score=-((z - parseFloat(MONTHLY_NORM[mo]))**2);
    if(score>bestScore){bestScore=score;bestMo=mo;}
  }

  // Current year of this sample
  const curAge=ageMap[s.name];
  const yr=Math.floor(curAge);
  // Target fractional year = centre of best month
  const targetAge=yr+parseFloat(MONTH_FRAC[bestMo]);
  const clamped=clamp(selIdx,targetAge);

  ageMap[s.name]=clamped;
  document.getElementById('age-input').value=clamped.toFixed(5);
  document.getElementById('age-slider').value=clamped;
  const moNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  updateEditPanel(); draw();
  setStatus(`Snapped ${s.path}#${s.path_num} → ${moNames[bestMo-1]} ${yr}  (${clamped.toFixed(3)})`);
}

// ── SELECTION ─────────────────────────────────────────────────────────────────
function selectSample(idx){
  selIdx=idx;
  if(idx<0||idx>=ALL_SAMPS.length){updateEditPanel();draw();return;}
  const s=ALL_SAMPS[idx];
  const age=ageMap[s.name];
  const{lo,hi}=getConstraint(idx);
  const inp=document.getElementById('age-input');
  inp.value=age.toFixed(5); inp.min=lo; inp.max=hi;
  const sl=document.getElementById('age-slider');
  sl.min=lo; sl.max=hi; sl.step=0.001; sl.value=age;
  updateEditPanel(); updateSidebar(); draw();
  setStatus(`Selected: ${s.path}#${s.path_num} — ${s.name}${s.pre1958?' [pre-1958 synthetic]':''}`);
}

function updateEditPanel(){
  const info=document.getElementById('edit-info');
  if(selIdx<0){info.innerHTML='Click a dot to select.';return;}
  const s=ALL_SAMPS[selIdx];
  const age=ageMap[s.name],orig=s.age_orig,delta=(age-orig)*365.25;
  const{lo,hi}=getConstraint(selIdx);
  const yr=Math.floor(age), mo=Math.round((age%1)*12)+1;
  const moNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  info.innerHTML=
    `<b>Path:</b> <span style="color:${pc(s.path)}">${s.path}</span> #${s.path_num}<br>`+
    `<b>d18O:</b> ${s.d18o_pdb!=null?s.d18o_pdb.toFixed(3):'—'} ‰<br>`+
    `<b>Current:</b> ${age.toFixed(4)} (~${moNames[Math.min(mo-1,11)]} ${yr})<br>`+
    `<b>Orig:</b> ${orig.toFixed(4)}<br>`+
    `<b>Δ:</b> ${delta>0?'+':''}${delta.toFixed(1)} d<br>`+
    `<b>Range:</b> ${lo.toFixed(3)}–${hi.toFixed(3)}`+
    (s.pre1958?'<br><b style="color:#f5a623">⚠ pre-1958 synthetic</b>':'');
  document.getElementById('snap-season').style.display=s.pre1958?'block':'block';
}

function onAgeIn(){
  if(selIdx<0) return;
  const v=parseFloat(document.getElementById('age-input').value);
  if(isNaN(v)) return;
  const c=clamp(selIdx,v);
  ageMap[ALL_SAMPS[selIdx].name]=c;
  document.getElementById('age-slider').value=c;
  updateEditPanel(); draw();
}
function onSlide(){
  if(selIdx<0) return;
  const v=parseFloat(document.getElementById('age-slider').value);
  const c=clamp(selIdx,v);
  ageMap[ALL_SAMPS[selIdx].name]=c;
  document.getElementById('age-input').value=c.toFixed(5);
  updateEditPanel(); draw();
}

// ── HIT TEST ──────────────────────────────────────────────────────────────────
function hitTest(px,py){
  const W=cmEl.width,H=cmEl.height;
  let best=-1,bestD=144;
  for(let i=0;i<ALL_SAMPS.length;i++){
    const s=ALL_SAMPS[i]; if(s.d18o_pdb==null) continue;
    const x=toX(ageMap[s.name],W); if(x<-12||x>W+12) continue;
    const y=toY(s.d18o_pdb,gVmin,gVmax,H);
    const d=(px-x)**2+(py-y)**2;
    if(d<bestD){bestD=d;best=i;}
  }
  return best;
}

cmEl.addEventListener('mousedown',e=>{
  const r=cmEl.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  const hit=hitTest(px,py);
  if(hit>=0){
    selectSample(hit);
    dragging={idx:hit,startX:px,startAge:ageMap[ALL_SAMPS[hit].name]};
  } else {
    panningBg=true; panStart={x:px,pan};
    selectSample(-1);
  }
});
window.addEventListener('mousemove',e=>{
  if(dragging){
    const r=cmEl.getBoundingClientRect(),px=e.clientX-r.left;
    const proposed=dragging.startAge+(px-dragging.startX)*(X_MAX-X_MIN)/(cmEl.width*zoom);
    const c=clamp(dragging.idx,proposed);
    ageMap[ALL_SAMPS[dragging.idx].name]=c;
    document.getElementById('age-input').value=c.toFixed(5);
    document.getElementById('age-slider').value=c;
    updateEditPanel(); draw();
  }
  if(panningBg){
    pan=panStart.pan+(e.clientX-document.getElementById('wrap-main').getBoundingClientRect().left-panStart.x);
    draw();
  }
});
window.addEventListener('mouseup',()=>{dragging=null;panningBg=false;});
cmEl.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=cmEl.getBoundingClientRect(),px=e.clientX-r.left;
  const f=e.deltaY<0?1.18:1/1.18;
  pan=(pan-px)*f+px;
  zoom=Math.max(0.8,Math.min(60,zoom*f));
  draw();
},{passive:false});
cmEl.addEventListener('mousemove',e=>{
  if(dragging||panningBg) return;
  const r=cmEl.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  const hit=hitTest(px,py);
  const tip=document.getElementById('tooltip');
  if(hit>=0){
    const s=ALL_SAMPS[hit],age=ageMap[s.name];
    const yr=Math.floor(age),mo=Math.round((age%1)*12)+1;
    const moN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    tip.innerHTML=`<b style="color:${pc(s.path)}">${s.path}#${s.path_num}</b>`+
      `${s.pre1958?' <span style="color:#f5a623">[synth]</span>':''}<br>`+
      `Age: ${age.toFixed(3)} (~${moN[Math.min(mo-1,11)]} ${yr})<br>`+
      `d18O: ${s.d18o_pdb!=null?s.d18o_pdb.toFixed(3):'-'}`;
    tip.style.display='block';
    tip.style.left=(e.clientX+14)+'px';
    tip.style.top=(e.clientY-10)+'px';
  } else tip.style.display='none';
});
cmEl.addEventListener('mouseleave',()=>document.getElementById('tooltip').style.display='none');

// ── SIDEBAR ───────────────────────────────────────────────────────────────────
function updateSidebar(){
  const list=document.getElementById('sample-list');
  list.innerHTML='';
  for(let i=0;i<ALL_SAMPS.length;i++){
    const s=ALL_SAMPS[i];
    const age=ageMap[s.name];
    const mod=Math.abs(age-s.age_orig)>0.0005;
    const div=document.createElement('div');
    div.className='sr'+(i===selIdx?' sel':'')+(mod?' mod':'');
    const yr=Math.floor(age),mo=Math.round((age%1)*12)+1;
    const moN=['J','F','M','A','M','J','J','A','S','O','N','D'];
    div.innerHTML=
      `<span class="sn" style="color:${s.pre1958?'rgba(245,166,35,0.8)':pc(s.path)}">`+
        `${s.path}#${s.path_num}</span>`+
      `<span class="sa">${moN[Math.min(mo-1,11)]}${yr}</span>`;
    div.onclick=()=>selectSample(i);
    list.appendChild(div);
  }
  if(selIdx>=0){
    const rows=list.querySelectorAll('.sr');
    if(rows[selIdx]) rows[selIdx].scrollIntoView({block:'nearest'});
  }
}

// ── STATS ─────────────────────────────────────────────────────────────────────
function iclim(age){
  const cx=CLIM.map(p=>p.x),cy2=CLIM.map(p=>p.y);
  let lo=0,hi=cx.length-1;
  if(age<cx[0]||age>cx[hi]) return NaN;
  while(hi-lo>1){const m=(lo+hi)>>1;if(cx[m]<=age)lo=m;else hi=m;}
  const t=(age-cx[lo])/(cx[hi]-cx[lo]);
  return cy2[lo]+t*(cy2[hi]-cy2[lo]);
}
function computeR(minYr,maxYr){
  const pairs=ALL_SAMPS
    .filter(s=>s.d18o_pdb!=null)
    .map(s=>({v:s.d18o_pdb,c:iclim(ageMap[s.name]),a:ageMap[s.name]}))
    .filter(p=>!isNaN(p.c)&&p.a>=(minYr||0)&&p.a<=(maxYr||9999));
  if(pairs.length<5) return NaN;
  const xm=pairs.reduce((s,p)=>s+p.v,0)/pairs.length;
  const ym=pairs.reduce((s,p)=>s+p.c,0)/pairs.length;
  const num=pairs.reduce((s,p)=>s+(p.v-xm)*(p.c-ym),0);
  const dx=Math.sqrt(pairs.reduce((s,p)=>s+(p.v-xm)**2,0));
  const dy=Math.sqrt(pairs.reduce((s,p)=>s+(p.c-ym)**2,0));
  return (dx*dy)<1e-12?NaN:num/(dx*dy);
}
function updateStats(){
  const rp=computeR(1958); document.getElementById('r-post').textContent=isNaN(rp)?'—':rp.toFixed(4);
  const rr=computeR(0,1958); document.getElementById('r-pre').textContent=isNaN(rr)?'—':rr.toFixed(4);
  let nmod=0;
  for(const s of ALL_SAMPS) if(Math.abs(ageMap[s.name]-s.age_orig)>0.0005) nmod++;
  document.getElementById('n-mod').textContent=nmod;
  document.getElementById('n-snap').textContent=snapshots.length;
}

// ── SAVE / RESET / EXPORT ────────────────────────────────────────────────────
function saveSnap(){
  snapshots.push({label:`Snap ${snapshots.length+1}`,ages:Object.assign({},ageMap)});
  const rp=computeR(1958), rr=computeR(0,1958);
  setStatus(`💾 Snap ${snapshots.length} — r post-58: ${isNaN(rp)?'—':rp.toFixed(4)}  r pre-58: ${isNaN(rr)?'—':rr.toFixed(4)}`);
  updateStats();
}
function resetAll(){
  for(const s of ALL_SAMPS) ageMap[s.name]=s.age_orig;
  selIdx=-1; updateEditPanel(); updateSidebar(); draw();
  setStatus('Reset to imported ages');
}
function exportCSV(){
  let csv='name,path,path_num,d18o_pdb,age_orig,age_edited,delta_days\n';
  for(const s of ALL_SAMPS){
    const age=ageMap[s.name],d=(age-s.age_orig)*365.25;
    csv+=`${s.name},${s.path},${s.path_num},`+
         `${s.d18o_pdb!=null?s.d18o_pdb.toFixed(5):''},`+
         `${s.age_orig.toFixed(6)},${age.toFixed(6)},${d.toFixed(2)}\n`;
  }
  csv+='\n# SNAPSHOTS\n';
  snapshots.forEach((snap,i)=>{
    const rp=computeRFromMap(snap.ages,1958),rr=computeRFromMap(snap.ages,0,1958);
    csv+=`# ${i+1},${snap.label},r_post=${isNaN(rp)?'?':rp.toFixed(4)},r_pre=${isNaN(rr)?'?':rr.toFixed(4)}\n`;
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='coral_age_edits_v2.csv'; a.click();
}
function computeRFromMap(map,minYr,maxYr){
  const pairs=ALL_SAMPS
    .filter(s=>s.d18o_pdb!=null)
    .map(s=>({v:s.d18o_pdb,c:iclim(map[s.name]||s.age_orig),a:map[s.name]||s.age_orig}))
    .filter(p=>!isNaN(p.c)&&p.a>=(minYr||0)&&p.a<=(maxYr||9999));
  if(pairs.length<5) return NaN;
  const xm=pairs.reduce((s,p)=>s+p.v,0)/pairs.length;
  const ym=pairs.reduce((s,p)=>s+p.c,0)/pairs.length;
  const num=pairs.reduce((s,p)=>s+(p.v-xm)*(p.c-ym),0);
  const dx=Math.sqrt(pairs.reduce((s,p)=>s+(p.v-xm)**2,0));
  const dy=Math.sqrt(pairs.reduce((s,p)=>s+(p.c-ym)**2,0));
  return (dx*dy)<1e-12?NaN:num/(dx*dy);
}
function importCSV(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    let n=0;
    for(const line of ev.target.result.split('\n')){
      if(!line||line.startsWith('#')) continue;
      const p=line.split(','); if(p[0]==='name') continue;
      const age=parseFloat(p[5]);
      if(ageMap.hasOwnProperty(p[0])&&!isNaN(age)){ageMap[p[0]]=age;n++;}
    }
    setStatus(`Imported ${n} ages`); draw();
  };
  reader.readAsText(file); e.target.value='';
}

// ── KEYBOARD ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&selIdx>=0){
    const dir=e.key==='ArrowRight'?1:-1;
    const step=e.shiftKey?0.05:e.altKey?0.001:0.01;
    const c=clamp(selIdx,ageMap[ALL_SAMPS[selIdx].name]+dir*step);
    ageMap[ALL_SAMPS[selIdx].name]=c;
    document.getElementById('age-input').value=c.toFixed(5);
    document.getElementById('age-slider').value=c;
    updateEditPanel(); draw(); e.preventDefault();
  }
  if((e.key==='ArrowUp'||e.key==='ArrowDown')&&selIdx>=0){
    e.preventDefault();
    selectSample(e.key==='ArrowDown'?
      Math.min(selIdx+1,ALL_SAMPS.length-1):Math.max(selIdx-1,0));
  }
  if(e.key==='s'&&(e.ctrlKey||e.metaKey)){e.preventDefault();saveSnap();}
  if(e.key==='Enter'&&selIdx>=0){snapToSeason();}
  if(e.key==='Escape'){selectSample(-1);}
});

function setStatus(msg){document.getElementById('status').textContent=msg;}

// ── INIT ─────────────────────────────────────────────────────────────────────
resize();
</script>
